<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html" lang="en">

<head>
    <script src="https://unpkg.com/konva@9.3.13/konva.min.js"></script>
    <meta charset="utf-8"/>
    <title>Cognitive Relay Diagram</title>
    <style>
        @font-face {
            font-family: 'Fira Code';
            src: url("assets/fonts/FiraCode-Bold.woff2") format("woff2"),
            url("assets/fonts/FiraCode-Bold.woff") format("woff");
            font-weight: bold;
            font-style: normal;
        }


        @font-face {
            font-family: 'Fira Code';
            src: url("assets/fonts/FiraCode-Regular.woff2") format("woff2"),
            url("assets/fonts/FiraCode-Regular.woff") format("woff");
            font-weight: normal;
            font-style: normal;
        }


        /* Center all content vertically and horizontally */
        body {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: stretch;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, serif;
        }


        h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        h3 {
            margin-bottom: 10px;
        }

        h4 {
            margin-bottom: 10px;
        }

        h5 {
            margin-bottom: 10px;
        }

        h6 {
            margin-bottom: 10px;
        }

        select {
            font-family: Fira Code, Roboto Mono, Liberation Mono, Consolas, monospace;
        }

        input::placeholder {
            text-transform: none;
        }


        .centered-text {
            display:block;
            width: 80%;
            align-self:center;
            text-align: center;
            font-size: xx-large;
        }

        .space {
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-flow: row wrap;
            align-self: center;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .selection-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            white-space: nowrap;
        }

        .selection-group-title {
        }

        .selection-group-items-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: auto;
            column-gap: 5px;
            row-gap: 10px;
        }

        .grid-span-2 {
            grid-column: span 2;
            justify-self: center;
        }

        .selection-group-items-grid > label {
            text-align: right;
        }

        .selection-group-items-grid > select {
            text-align: left;
        }

        .checkbox {
            grid-column: span 2;
            display: flex; /* Add flex display */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
        }



        #title-container {
            align-self: stretch;
            text-align: center;
            color: darkorange;
            font-family: Arial, serif;
            width: 100%;
            margin: 0 50px;
        }


        #title-container > h1 {
            margin-bottom: 5px;
        }

        /* Style for the "made by username" text */
        #made-by {
            margin-top: 0;
            font-size: 12px;
            color: #888;
        }

        /* Style for the boxed section containing the Konva circle */
        #cognitive-diagram-container {
            align-self: center;
            width: fit-content;
            height: fit-content;
            border: 2px solid #000;
            margin: 0 3vw 0 3vw;
        }
    </style>
</head>

<!-- BODY -------------------------------------------------------------------------------------------->

<body>
<div id="title-container">
    <h1>Cognitive Relay Diagram</h1>
    <p id="made-by">
        (by <a href="https://www.youtube.com/shorts/0Df2gRx7Fbw">The Freezing Chicken</a>,
        and based on the <a href="https://www.objectivepersonality.com/">Objective Personality System</a>) <br>
        Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1" target="_blank" rel="license noopener noreferrer" style="display:inline-block;">CC BY-SA 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1" alt=""></a>
    </p>
</div>

<div class="space"></div>

<p id="debug-text" hidden></p>
<p id="loading-text" class="centered-text" style="font-weight: bold">
    Loading... <br>
    (if nothing appears, passive-aggressive complaints are accepted)
</p>
<p id="help-text" class="centered-text">
    Click/Tap functions to pick the type. <br>
    Click this text to hide it forever.
</p>

<div class="main-container">
    <!-- Container for the diagram. Filled with JS. -->
    <div id="cognitive-diagram-container"></div>
</div>

<script type="module" src="js/index.js"></script>

</body>


</html>
